databases:
  - name: ticket-booking-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: ticket-booking-redis
    plan: free
    ipAllowList: []   # internal-only; free tier can't enable external access anyway

  - type: web
    name: ticket-booking-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticket-booking-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WAITLIST_TOKEN_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false   # paste your actual SendGrid API key here (starts SG.)
      - key: EMAIL_FROM
        sync: false   # sender address verified in your SendGrid account
      - key: CORS_ORIGIN
        sync: false   # set after Step 5 — your Vercel production URL
      - key: FRONTEND_URL
        sync: false   # same value as CORS_ORIGIN